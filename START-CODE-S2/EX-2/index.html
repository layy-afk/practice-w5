
<!DOCTYPE html>
<html>
<head>
    <title>Exercise 2 - Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Travel Gallery</h1>

    <div class="gallery">

        <div class="card big">
            <img src="https://picsum.photos/id/10/500/300">
            <h3>Beautiful Nature</h3>
            <p>Enjoy the beauty of nature.</p>
        </div>

        <div class="card tall">
            <img src="https://picsum.photos/id/15/300/400">
            <h3>Mountain View</h3>
            <p>Beautiful Mountain.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
            <h3>Beach</h3>
            <p>Enjoy the beach.</p>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/17/300/200">
            <h3>Green Forest</h3>
            <p>Explore the green forest.</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390" alt="City">
            <h3>City Life</h3>
            <p>Explore the city.</p>
        </div>

    </div>

</body>
</html>
