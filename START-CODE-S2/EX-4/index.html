
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Our Products</h1>

    <div class="product-container">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                 alt="Headphones">
            <h2>Headphones</h2>
            <p>High-quality wireless headphones.</p>
            <div class="product-bottom">
                <span>$45</span>
                <button>Buy Now</button>
            </div>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                 alt="Watch">
            <h2>Smart Watch</h2>
            <p>A stylish watch for everyday use.</p>
            <div class="product-bottom">
                <span>$99</span>
                <button>Buy Now</button>
            </div>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1503602642458-232111445657"
                 alt="Chair">
            <h2>Modern Chair</h2>
            <p>A comfortable chair for your room.</p>
            <div class="product-bottom">
                <span>$40</span>
                <button>Buy Now</button>
            </div>
        </div>

    </div>

</body>
</html>
